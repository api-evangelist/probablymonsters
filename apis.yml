aid: probablymonsters
name: ProbablyMonsters
description: >-
  ProbablyMonsters Inc. is an independent video game company headquartered in Bellevue,
  Washington, with a second location in Fort Worth, Texas. Founded in 2016 by former Bungie
  CEO Harold Ryan, it operates as a parent company that founds, funds and incubates
  development teams building AAA and AA interactive entertainment — publishing titles
  including Crimson Moon, Storm Lancers, IRE: A Prologue and Nekome. ProbablyMonsters sells
  finished games to players through console and PC storefronts; it is not a platform or
  developer-tools business. It publishes no developer program, no public API, no SDK and no
  machine-readable API description, and its GitHub organization carries zero public
  repositories. This profile records that absence with the probes behind it.
